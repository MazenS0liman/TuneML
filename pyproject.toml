[project]
name = "tune-ml"
version = "0.1.0"
description = "A ML library for audio classification and generation using DNN architectures."
authors = [
    {name = "mazen",email = "mazen.sayed.soliman@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "torchaudio (>=2.11.0,<3.0.0)",
    "mlflow (>=3.10.1,<4.0.0)",
    "mido (>=1.3.3,<2.0.0)",
    "music21 (>=9.9.1,<10.0.0)",
    "midi2audio (>=0.1.1,<0.2.0)",
    "transformers (>=5.5.0,<6.0.0)",
    "pretty-midi (>=0.2.11,<0.3.0)",
    "miditok (>=3.0.6.post1,<4.0.0)",
    "tokenizers (>=0.22.2,<0.23.0)",
    "nltk (>=3.9.4,<4.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "neucodec (>=0.0.5,<0.0.6)",
    "pyarrow (==14.0.2)",
    "sphinx (>=8.1.3)",
    "sphinx-rtd-theme (>=3.0.2,<4.0.0)",
    "breathe (>=4.36.0,<5.0.0)",
    "sphinx-js (>=5.0.1,<6.0.0)",
    "myst-parser (>=4.0.1,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tuneml" }]

[tool.poetry.dependencies]
numpy = "<1.23.0"
pandas = "<2.0.0"