[project]
name = "tune-ml"
version = "0.1.0"
description = "A ML library for audio classification and generation using DNN architectures."
authors = [
    {name = "mazen",email = "mazen.sayed.soliman@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "torchaudio (>=2.11.0,<3.0.0)",
    "mlflow (>=3.10.1,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
numpy = "<1.23.0"
pandas = "<2.0.0"